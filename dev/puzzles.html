<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puzzles · Dev</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #23202b;
        --dim: #6b6676;
        --line: #d9d3c7;
        --paper: #fbf8f2;
        --accent: #e0662d;
        --good: #2f9e5b;
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 260px;
        flex: none;
        border-right: 1px solid var(--line);
        padding: 10px;
        overflow-y: auto;
        background: #f3efe6;
      }
      nav h1 {
        font-size: 16px;
        margin: 4px 6px 10px;
      }
      nav h2 {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 12px 6px 4px;
      }
      nav a {
        display: block;
        padding: 4px 8px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }
      nav a.on {
        background: var(--accent);
        color: #fff;
      }
      nav a .tag {
        font-size: 11px;
        opacity: 0.7;
      }
      nav a.done::after {
        content: ' ✓';
        color: var(--good);
        font-weight: 700;
      }
      nav a.on.done::after {
        color: #fff;
      }
      main {
        flex: 1;
        min-width: 0;
        padding: 16px 22px 40px;
      }
      main h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .meta {
        color: var(--dim);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .rules {
        max-width: 760px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 12px;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .status {
        color: var(--dim);
      }
      .status.win {
        color: var(--good);
        font-weight: 700;
      }
      button {
        font: inherit;
        padding: 5px 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .cell {
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: #fff;
        user-select: none;
      }
      @media (max-width: 760px) {
        body {
          flex-direction: column;
        }
        nav {
          width: auto;
          max-height: 32vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <!-- Dev tool: functional prototypes of the 19 puzzles (?p=<id>). Excluded by `npm run build:release`. -->
    <nav></nav>
    <main></main>
    <script type="module" src="/src/proto/index.ts"></script>
  </body>
</html>
